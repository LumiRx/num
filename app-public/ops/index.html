<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>NUM · Ops</title>
<meta name="robots" content="noindex,nofollow">
<!--
  The ops console, rebuilt 4 Aug 2026.

  WHAT THIS REPLACES
  The old /console rendered hand-typed arrays: 12,930 QR scans, ฿418,200 from a
  yacht partner, seven measures green, "improving for 8 straight weeks". The
  real database at the time held 80 members, 0 verified, 4 conversations and 6
  bookings. Every trend line sloped up because someone typed it sloping up.

  THE RULE THIS FILE KEEPS
  Every number on this page comes from /api/admin/overview, which reads D1. If
  a number is wrong, the SQL is wrong. There is no seed data in this file, and
  a guard test fails the build if anyone adds any.

  Counts lead; rates follow in small type WITH their denominator, because a
  "13% booking rate" off 6 bookings moves 16 points when one more person books.
  Showing the denominator is what stops that number from lying.
-->
<style>
  :root{
    --ink:#201e1d; --ink2:#3d3936; --dim:#7a736d; --line:#e8e3dd;
    --bg:#faf7f4; --card:#fff; --ember:#ec3013; --good:#0e6b45; --warn:#b8860b;
    --mono:ui-monospace,SFMono-Regular,Menlo,monospace;
  }
  *{box-sizing:border-box}
  body{margin:0;font:15px/1.55 -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;
       color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased}
  header{background:var(--ink);color:#fff;padding:14px 20px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  .mark{width:26px;height:26px;background:#fff;position:relative;flex:0 0 auto}
  .mark i{position:absolute;right:0;bottom:0;width:8px;height:8px;background:var(--ember)}
  .mark b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
          color:var(--ink);font:800 15px/1 var(--mono)}
  h1{font-size:15px;margin:0;font-weight:700;letter-spacing:-.01em}
  .env{font:600 11px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:#b9b2ab;margin-left:auto}
  nav{display:flex;gap:2px;background:var(--ink);padding:0 12px;overflow-x:auto}
  nav button{background:none;border:0;color:#b9b2ab;padding:11px 15px;font:600 14px/1 inherit;
             cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap}
  nav button[aria-selected=true]{color:#fff;border-bottom-color:var(--ember)}
  main{padding:20px;max-width:1180px;margin:0 auto}
  .grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));margin-bottom:20px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:15px}
  .card .k{font:600 11px/1.3 var(--mono);letter-spacing:.09em;text-transform:uppercase;color:var(--dim)}
  .card .v{font:700 30px/1.15 inherit;margin:7px 0 2px;letter-spacing:-.02em}
  .card .sub{font-size:12.5px;color:var(--dim)}
  .card.alert{border-color:var(--ember);background:#fff6f4}
  .card.alert .v{color:var(--ember)}
  section{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px;margin-bottom:18px}
  section h2{font-size:16px;margin:0 0 3px;letter-spacing:-.01em}
  section p.note{margin:0 0 15px;color:var(--dim);font-size:13px}
  table{width:100%;border-collapse:collapse;font-size:14px}
  th{text-align:left;font:600 11px/1.3 var(--mono);letter-spacing:.08em;text-transform:uppercase;
     color:var(--dim);padding:0 10px 8px 0;border-bottom:1px solid var(--line)}
  td{padding:10px 10px 10px 0;border-bottom:1px solid var(--line);vertical-align:top}
  tr:last-child td{border-bottom:0}
  .mono{font-family:var(--mono);font-size:13px}
  .empty{color:var(--dim);font-size:14px;padding:16px 0;font-style:italic}
  .pill{display:inline-block;font:600 11px/1 var(--mono);padding:4px 8px;border-radius:99px;
        background:#f1ede8;color:var(--ink2);letter-spacing:.04em}
  .pill.bad{background:#fde8e4;color:var(--ember)}
  .pill.ok{background:#e3f3ec;color:var(--good)}
  .banner{background:#fff6f4;border:1px solid var(--ember);border-radius:12px;padding:16px 18px;margin-bottom:18px}
  .banner h3{margin:0 0 5px;font-size:15px;color:var(--ember)}
  .banner p{margin:0;font-size:14px;color:var(--ink2)}
  .login{max-width:340px;margin:70px auto;text-align:center}
  input{width:100%;padding:12px;border:1px solid var(--line);border-radius:9px;font:inherit;margin:9px 0}
  button.go{background:var(--ink);color:#fff;border:0;border-radius:9px;padding:12px 20px;
            font:600 15px inherit;cursor:pointer;width:100%}
  .err{color:var(--ember);font-size:13.5px;margin-top:9px}
  .chart{width:100%;height:110px;display:block}
  .chart .ax{stroke:var(--line);stroke-width:1}
  .chartwrap{margin-top:6px}
  .chartwrap .lbl{display:flex;justify-content:space-between;font:600 11px var(--mono);color:var(--dim);margin-top:4px}
  .foot{color:var(--dim);font-size:12.5px;margin-top:26px;padding-top:14px;border-top:1px solid var(--line)}
  @media(max-width:640px){ main{padding:14px} .card .v{font-size:26px} }
</style>
</head>
<body>

<div id="gate" class="login" hidden>
  <h1 style="color:var(--ink);font-size:19px">NUM Ops</h1>
  <p style="color:var(--dim);font-size:14px">Admin key required.</p>
  <input id="key" type="password" placeholder="Admin key" autocomplete="current-password">
  <button class="go" id="signin">Sign in</button>
  <div class="err" id="err"></div>
</div>

<div id="app" hidden>
  <header>
    <span class="mark"><b>N</b><i></i></span>
    <h1>NUM · Ops</h1>
    <span class="env" id="env">loading</span>
  </header>
  <nav id="tabs" role="tablist"></nav>
  <main id="view"></main>
</div>

<script>
/* ── plumbing ─────────────────────────────────────────────────────────────
   The admin key is held in memory and in sessionStorage only — never
   localStorage. Closing the tab ends the session; a shared laptop does not
   inherit it. */
const S = { key: sessionStorage.getItem('num_ops') || '', data: null, tab: 'today', days: 30 };
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const n = (v) => (v == null ? '—' : Number(v).toLocaleString());

/* A rate is only shown WITH the denominator that produced it. At small n the
   denominator is the honest part of the sentence. */
function rate(num, den) {
  if (!den) return '';
  return `${Math.round((num / den) * 100)}% of ${n(den)}`;
}
const ago = (ts) => {
  if (!ts) return '—';
  const s = (Date.now() - new Date(ts.replace(' ', 'T') + 'Z').getTime()) / 1000;
  if (s < 3600) return Math.max(1, Math.round(s / 60)) + 'm ago';
  if (s < 86400) return Math.round(s / 3600) + 'h ago';
  return Math.round(s / 86400) + 'd ago';
};

async function load() {
  const r = await fetch(`/api/admin/overview?days=${S.days}`, { headers: { 'X-Admin-Session': S.key } });
  if (r.status === 401) { S.key = ''; sessionStorage.removeItem('num_ops'); throw new Error('unauthorized'); }
  if (!r.ok) throw new Error('HTTP ' + r.status);
  return r.json();
}

/* ── charts: real series only ─────────────────────────────────────────────
   Draws whatever it is given. A flat week draws flat. If every point is zero
   it says so in words rather than drawing a straight line that looks like a
   working chart reporting nothing. */
function spark(series, color) {
  if (!series || !series.length) return '<div class="empty">No data.</div>';
  const max = Math.max(...series.map((p) => p.n));
  if (max === 0) return `<div class="empty">Nothing in the last ${series.length} days.</div>`;
  const W = 600, H = 100, step = W / Math.max(1, series.length - 1);
  const pts = series.map((p, i) => `${(i * step).toFixed(1)},${(H - (p.n / max) * (H - 12)).toFixed(1)}`);
  const total = series.reduce((a, p) => a + p.n, 0);
  return `<div class="chartwrap">
    <svg class="chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img"
         aria-label="${series.length} day series, ${total} total, peak ${max}">
      <line class="ax" x1="0" y1="${H}" x2="${W}" y2="${H}"/>
      <polyline fill="none" stroke="${color}" stroke-width="2.5" points="${pts.join(' ')}"/>
    </svg>
    <div class="lbl"><span>${series[0].d}</span><span>peak ${max}/day · ${total} total</span><span>${series[series.length-1].d}</span></div>
  </div>`;
}

const card = (k, v, sub, alert) =>
  `<div class="card${alert ? ' alert' : ''}"><div class="k">${esc(k)}</div>
   <div class="v">${v}</div><div class="sub">${esc(sub || '')}</div></div>`;

function tbl(cols, rows, render, emptyMsg) {
  if (!rows || !rows.length) return `<div class="empty">${esc(emptyMsg)}</div>`;
  return `<table><thead><tr>${cols.map((c) => `<th>${esc(c)}</th>`).join('')}</tr></thead>
    <tbody>${rows.map(render).join('')}</tbody></table>`;
}

/* ── tabs ─────────────────────────────────────────────────────────────── */
const TABS = {
  today: ['Today', (d) => {
    const t = d.todo || {}, a = d.app || {};
    const blocked = (a.members > 0) && !a.verified;
    return (blocked ? `<div class="banner">
        <h3>Nothing can convert: 0 of ${n(a.members)} members are phone-verified.</h3>
        <p>Verification is the gate every downstream number sits behind — bookings, Stars, memberships.
           While this reads zero, ad spend buys signups that cannot finish. Check the A2P campaign status first.</p>
      </div>` : '') +
      `<div class="grid">
        ${card('Needs verifying', n((t.unverified || []).length), 'gave a phone, never verified', blocked)}
        ${card('Businesses waiting', n((t.claims_new || []).length), 'signed up, not yet contacted', (t.claims_new || []).length > 0)}
        ${card('Bookings pending', n((t.bookings_pending || []).length), 'guest waiting on a venue', (t.bookings_pending || []).length > 0)}
        ${card('Active today', n(a.active24), 'opened the app in 24h')}
      </div>
      <section><h2>Businesses waiting on a call</h2>
        <p class="note">From the web form. Every hour here is a partner cooling off.</p>
        ${tbl(['Business', 'Contact', 'Phone', 'Waiting'], t.claims_new,
          (r) => `<tr><td><b>${esc(r.business_name)}</b></td><td>${esc(r.contact_name || '—')}</td>
                  <td class="mono">${esc(r.phone || '—')}</td><td>${ago(r.created_at)}</td></tr>`,
          'Nobody waiting. Every web signup has been contacted.')}
      </section>
      <section><h2>Signed up, never verified</h2>
        <p class="note">They gave a phone number and stopped. Newest first.</p>
        ${tbl(['Name', 'Phone', 'Signed up'], (t.unverified || []).slice(0, 12),
          (r) => `<tr><td>${esc(r.name || '—')}</td><td class="mono">${esc(r.phone || '')}</td><td>${ago(r.created_at)}</td></tr>`,
          'Nobody stuck at verification.')}
      </section>`;
  }],

  funnel: ['Funnel', (d) => {
    const a = d.app || {}, b = d.brain || {}, s = d.series || {};
    return `<div class="grid">
        ${card('Members', n(a.members), `${n(d.engagement?.active_7d)} active this week`)}
        ${card('Verified', n(a.verified), rate(a.verified, a.members) || 'none yet', !a.verified)}
        ${card('Conversations', n(b.messages), 'messages, all channels')}
        ${card('Bookings', n(b.bookings), rate(b.bookings, a.members))}
      </div>
      <section><h2>Signups · last ${s.days || 30} days</h2>
        <p class="note">One point per day, straight from D1. Zero days are drawn as zero.</p>
        ${spark(s.signups, '#201e1d')}</section>
      <section><h2>Verified · last ${s.days || 30} days</h2>
        <p class="note">The line that has to move before any other line matters.</p>
        ${spark(s.verified, '#ec3013')}</section>
      <section><h2>Messages · last ${s.days || 30} days</h2>${spark(s.messages, '#0e6b45')}</section>
      <section><h2>Where they came from</h2>
        <p class="note">First-touch attribution. <b>Verified</b> is the column that matters — a source
          with signups and no verifications is producing typos, not people.</p>
        ${tbl(['Source', 'Campaign', 'Signups', 'Verified'], a.by_source,
          (r) => `<tr><td><b>${esc(r.source)}</b></td><td class="mono">${esc(r.campaign || '—')}</td>
                  <td>${n(r.signups)}</td><td>${n(r.verified)}</td></tr>`,
          'No tagged traffic yet. Ads use /go/ links, which set the tags.')}
      </section>`;
  }],

  supply: ['Supply', (d) => {
    const biz = d.business || {}, dir = d.directory || {};
    return `<div class="grid">
        ${card('Businesses', n(biz.businesses), 'profiles created')}
        ${card('Claims', n(biz.claims), 'ownership claimed')}
        ${card('Directory', n(dir.places), `${n(dir.withPhoto)} with a photo`)}
        ${card('Destinations', n(dir.destinations), 'markets live')}
      </div>
      <section><h2>Businesses</h2>
        <p class="note">Every business record in D1 — not a curated list.</p>
        ${tbl(['Business', 'State', 'Created'], biz.rows,
          (r) => `<tr><td><b>${esc(r.name || r.business_name || r.id)}</b></td>
                  <td><span class="pill">${esc(r.state || r.status || '—')}</span></td>
                  <td>${ago(r.created_at)}</td></tr>`,
          'No businesses onboarded yet.')}
      </section>`;
  }],

  system: ['System', (d) => {
    const ai = d.ai || {}, m = d.money || {}, reach = d.reach || {}, rails = d.rails || {};
    const railRow = (k, on) => `<tr><td>${esc(k)}</td><td>
      <span class="pill ${on ? 'ok' : 'bad'}">${on ? 'connected' : 'off'}</span></td></tr>`;
    return `<div class="grid">
        ${card('AI spend', '$' + (ai.spend_usd ?? 0).toFixed(2), `${n(ai.turns)} turns · ${ai.window_days}d`)}
        ${card('Per turn', '$' + (ai.per_turn_usd ?? 0).toFixed(4), 'model cost per answer')}
        ${card('Stars circulating', n(m.circulating), m.escrow_balanced ? 'escrow balanced' : 'ESCROW DRIFT', !m.escrow_balanced)}
        ${card('Push delivery', reach.delivery_rate == null ? '—' : Math.round(reach.delivery_rate * 100) + '%',
               `${n(reach.notifications_delivered)} of ${n(reach.notifications_queued)}`)}
      </div>
      <section><h2>Rails</h2>
        <p class="note">Read from live config, not a list someone maintains by hand.</p>
        <table><tbody>${Object.entries(rails)
          .filter(([, v]) => typeof v === 'boolean')
          .map(([k, v]) => railRow(k, v)).join('')}</tbody></table>
      </section>
      <section><h2>Recent admin sign-ins</h2>
        ${tbl(['Who', 'OK', 'When'], d.operator?.recent_logins,
          (r) => `<tr><td class="mono">${esc(r.who || '—')}</td>
                  <td><span class="pill ${r.ok ? 'ok' : 'bad'}">${r.ok ? 'ok' : 'failed'}</span></td>
                  <td>${ago(r.created_at)}</td></tr>`, 'No sign-ins recorded.')}
      </section>`;
  }],
};

function render() {
  $('tabs').innerHTML = Object.entries(TABS).map(([k, [label]]) =>
    `<button role="tab" aria-selected="${k === S.tab}" onclick="pick('${k}')">${label}</button>`).join('');
  try {
    $('view').innerHTML = TABS[S.tab][1](S.data) +
      `<div class="foot">Every number above is read from D1 at load time. Window: ${S.days} days.
       Nothing on this page is seeded or illustrative.</div>`;
  } catch (e) {
    $('view').innerHTML = `<section><h2>This tab failed to render</h2>
      <p class="note">${esc(e.message)} — the data loaded, so this is a display bug, not a data outage.</p></section>`;
  }
}
window.pick = (k) => { S.tab = k; render(); };

async function boot() {
  if (!S.key) { $('gate').hidden = false; return; }
  try {
    S.data = await load();
    $('gate').hidden = true; $('app').hidden = false;
    $('env').textContent = (S.data.operator?.signed_in_as || 'admin') + ' · live';
    render();
  } catch (e) {
    $('gate').hidden = false; $('app').hidden = true;
    $('err').textContent = e.message === 'unauthorized' ? 'Key rejected.' : 'Could not load: ' + e.message;
  }
}
/* Exchange the admin key for a signed session token.
 *
 * This step was missing, and its absence made the console unopenable with ANY
 * key. The typed value used to go straight into the X-Admin-Session header,
 * but that header is verified by sessionClaims(), which splits on "." and
 * needs `payload.signature` — so a raw key failed before it was ever compared
 * to ADMIN_KEY. Every attempt returned "Key rejected", which reads as a wrong
 * password and sent us rotating a secret that was fine.
 *
 * The key is sent once, here, and never stored; only the token it returns is
 * kept, and that expires on its own. */
$('signin').onclick = async () => {
  const key = $('key').value.trim();
  if (!key) return;
  $('err').textContent = 'Checking…';
  try {
    const r = await fetch('/api/admin/session', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ key }),
    });
    const d = await r.json().catch(() => ({}));
    if (!r.ok) { $('err').textContent = d.error || 'That key does not match.'; return; }
    S.key = d.token;
    sessionStorage.setItem('num_ops', d.token);
    $('err').textContent = '';
    boot();
  } catch (e) {
    $('err').textContent = 'Could not reach the sign-in endpoint: ' + (e?.message ?? e);
  }
};
$('key').addEventListener('keydown', (e) => { if (e.key === 'Enter') $('signin').click(); });
boot();
</script>
</body>
</html>
