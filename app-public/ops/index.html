<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>NUM Ops</title>
<!--
  NUM Ops — the operator console.

  Every number here comes from /api/admin/overview, which reads D1 directly.
  Nothing on this page is illustrative, and nothing is hand-typed. That rule is
  the whole reason the old /console/ was retired: it showed invented figures
  (12,930 QR scans, ฿418,200 from a yacht partner) against a database holding 80
  members and 6 bookings, and people started quoting it as fact.

  So: if a series is empty it says so in words rather than drawing a flat line
  that looks like a working chart reporting nothing, and every rate is shown
  with the denominator that produced it. At small n the denominator is the
  honest half of the sentence.

  Self-contained on purpose — no CDN, no fonts, no analytics. It is served from
  Worker assets behind an admin session, and a console that phones out is a
  console that leaks who is looking at it.
-->
<style>
  :root{
    --ink:#14120F; --ink-2:#2A2622; --body:#494340; --dim:#8A827B;
    --bg:#F6F4F1; --panel:#fff; --line:#E7E2DB; --line-2:#F1EDE7;
    --ember:#EC3013; --teal:#0EA483; --teal-ink:#0B7C63; --amber:#B8860B;
    --mono:ui-monospace,SFMono-Regular,Menlo,monospace;
    --r:14px; --shadow:0 1px 2px rgba(20,18,15,.04), 0 8px 24px -12px rgba(20,18,15,.12);
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;
       font:15px/1.55 -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif}
  .num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}

  /* ── shell ─────────────────────────────────────────────────────────── */
  .shell{display:grid;grid-template-columns:230px 1fr;min-height:100vh}
  aside{background:var(--ink);color:#EDE9E4;display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
  .brand{display:flex;align-items:center;gap:11px;padding:20px 18px 22px}
  .mark{width:28px;height:28px;background:#fff;position:relative;flex:0 0 auto;border-radius:5px}
  .mark i{position:absolute;right:0;bottom:0;width:9px;height:9px;background:var(--ember);border-radius:0 0 5px 0}
  .mark b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--ink);font:800 15px/1 var(--mono)}
  .brand h1{font-size:15px;margin:0;font-weight:650;letter-spacing:-.01em;color:#fff}
  .brand span{display:block;font:600 10px/1.4 var(--mono);letter-spacing:.13em;text-transform:uppercase;color:#7E766F}
  nav{display:flex;flex-direction:column;gap:2px;padding:0 10px;flex:1}
  nav button{display:flex;align-items:center;gap:11px;width:100%;background:none;border:0;cursor:pointer;
             color:#A69E96;padding:10px 11px;border-radius:9px;font:550 14px/1 inherit;text-align:left;transition:.13s}
  nav button:hover{background:#211E1A;color:#E4DFD9}
  nav button[aria-selected=true]{background:#262220;color:#fff}
  nav button svg{width:16px;height:16px;flex:0 0 auto;opacity:.85}
  nav button[aria-selected=true] svg{opacity:1;color:var(--ember)}
  .side-foot{padding:14px 18px 18px;border-top:1px solid #262220;font-size:12px;color:#7E766F}
  .side-foot b{display:block;color:#C9C2BB;font-weight:600;font-size:12.5px;margin-bottom:2px}

  /* ── top bar ───────────────────────────────────────────────────────── */
  .col{display:flex;flex-direction:column;min-width:0}
  .top{display:flex;align-items:center;gap:14px;padding:18px 26px;background:var(--bg);
       border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5;flex-wrap:wrap}
  .top h2{margin:0;font-size:19px;letter-spacing:-.02em;font-weight:650}
  .top .sub{margin:2px 0 0;font-size:13px;color:var(--dim)}
  .spacer{margin-left:auto}
  .seg{display:inline-flex;background:#EDE9E3;border-radius:9px;padding:3px}
  .seg button{border:0;background:none;cursor:pointer;padding:6px 12px;border-radius:7px;
              font:600 12.5px/1 inherit;color:var(--body)}
  .seg button[aria-pressed=true]{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.07)}
  .live{display:inline-flex;align-items:center;gap:7px;font:600 11.5px/1 var(--mono);
        letter-spacing:.08em;text-transform:uppercase;color:var(--dim)}
  .dot{width:7px;height:7px;border-radius:99px;background:var(--teal)}
  .ghost{border:1px solid var(--line);background:#fff;border-radius:9px;padding:7px 13px;
         font:600 13px/1 inherit;color:var(--body);cursor:pointer}
  .ghost:hover{border-color:#D6CFC6;color:var(--ink)}
  main{padding:24px 26px 60px;max-width:1320px;width:100%}

  /* ── banner ────────────────────────────────────────────────────────── */
  .banner{display:flex;gap:14px;background:#fff;border:1px solid #F3C9C0;border-left:3px solid var(--ember);
          border-radius:var(--r);padding:16px 18px;margin-bottom:22px;box-shadow:var(--shadow)}
  .banner .bi{width:22px;height:22px;flex:0 0 auto;color:var(--ember);margin-top:1px}
  .banner h3{margin:0 0 4px;font-size:15px;letter-spacing:-.01em}
  .banner p{margin:0;font-size:13.5px;color:var(--body);max-width:76ch}

  /* ── kpis ──────────────────────────────────────────────────────────── */
  .kpis{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(232px,1fr));margin-bottom:20px}
  .kpi{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px 17px 12px;
       box-shadow:var(--shadow);position:relative;overflow:hidden}
  .kpi .k{font:600 10.5px/1.3 var(--mono);letter-spacing:.11em;text-transform:uppercase;color:var(--dim)}
  .kpi .v{font:660 33px/1.1 inherit;letter-spacing:-.03em;margin:9px 0 3px}
  .kpi .sub{font-size:12.5px;color:var(--dim);min-height:18px}
  .kpi .trend{position:absolute;top:14px;right:15px;font:600 11.5px/1 var(--mono);padding:4px 7px;border-radius:6px}
  .trend.up{background:#E6F5F0;color:var(--teal-ink)}
  .trend.down{background:#FBEAE7;color:var(--ember)}
  .trend.flat{background:#F1EDE7;color:var(--dim)}
  .kpi .mini{margin:8px -17px -12px;display:block;width:calc(100% + 34px);height:38px}
  .kpi.alert{border-color:#F0BFB4}
  .kpi.alert .v{color:var(--ember)}

  /* ── panels ────────────────────────────────────────────────────────── */
  .row{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));margin-bottom:16px}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);
         box-shadow:var(--shadow);margin-bottom:16px;overflow:hidden}
  .panel > header{padding:16px 18px 13px;border-bottom:1px solid var(--line-2)}
  .panel h3{margin:0;font-size:15px;letter-spacing:-.01em;font-weight:640}
  .panel .note{margin:3px 0 0;font-size:12.5px;color:var(--dim);max-width:80ch}
  .panel .body{padding:16px 18px 18px}
  .panel .body.flush{padding:0}

  /* ── charts ────────────────────────────────────────────────────────── */
  .chart{display:block;width:100%;height:170px}
  .chart .grid line{stroke:var(--line-2);stroke-width:1}
  .chart .ax{stroke:var(--line);stroke-width:1}
  .lbl{display:flex;justify-content:space-between;margin-top:9px;font:600 11px/1 var(--mono);
       letter-spacing:.05em;color:var(--dim);text-transform:uppercase}

  /* ── bars ──────────────────────────────────────────────────────────── */
  .bars{display:flex;flex-direction:column;gap:11px}
  .bar-row{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center}
  .bar-label{font-size:13.5px;font-weight:550}
  .bar-track{grid-column:1/-1;height:7px;background:#F1EDE7;border-radius:99px;overflow:hidden}
  .bar-fill{height:100%;border-radius:99px;background:var(--ink)}
  .bar-fill.t{background:var(--teal)}
  .bar-val{font:600 12.5px/1 var(--mono);color:var(--dim)}

  /* ── tables ────────────────────────────────────────────────────────── */
  table{width:100%;border-collapse:collapse;font-size:14px}
  thead th{text-align:left;font:600 10.5px/1.3 var(--mono);letter-spacing:.09em;text-transform:uppercase;
           color:var(--dim);padding:11px 16px;background:#FBFAF8;border-bottom:1px solid var(--line-2);
           position:sticky;top:0}
  td{padding:12px 16px;border-bottom:1px solid var(--line-2);vertical-align:middle}
  tbody tr:last-child td{border-bottom:0}
  tbody tr:hover{background:#FBFAF8}
  .mono{font-family:var(--mono);font-size:12.5px;color:var(--body)}
  .empty{color:var(--dim);font-size:13.5px;padding:22px 18px;text-align:center}
  .pill{display:inline-block;font:600 11px/1 var(--mono);padding:5px 9px;border-radius:99px;
        background:#F1EDE7;color:var(--ink-2);letter-spacing:.04em}
  .pill.ok{background:#E6F5F0;color:var(--teal-ink)}
  .pill.bad{background:#FBEAE7;color:var(--ember)}

  /* ── gate ──────────────────────────────────────────────────────────── */
  .gate{min-height:100vh;display:grid;place-items:center;padding:24px}
  .gate .box{width:100%;max-width:330px;text-align:center}
  .gate .mark{margin:0 auto 18px;background:var(--ink)}
  .gate .mark b{color:#fff}
  .gate h2{margin:0 0 6px;font-size:19px;letter-spacing:-.02em}
  .gate p{margin:0 0 20px;color:var(--dim);font-size:13.5px}
  .gate input{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:10px;
              font:15px inherit;background:#fff;margin-bottom:10px}
  .gate input:focus{outline:2px solid var(--ink);outline-offset:-1px;border-color:transparent}
  .gate button{width:100%;padding:12px;border:0;border-radius:10px;background:var(--ink);color:#fff;
               font:600 15px inherit;cursor:pointer}
  .err{color:var(--ember);font-size:14.5px;font-weight:700;margin-top:12px;min-height:20px}
  .gate input.bad{outline:2px solid var(--ember);outline-offset:-1px;border-color:transparent}
  @keyframes shake{10%,90%{transform:translateX(-2px)}20%,80%{transform:translateX(3px)}30%,50%,70%{transform:translateX(-5px)}40%,60%{transform:translateX(5px)}}
  .gate .box.shake{animation:shake .45s}

  @media (max-width:860px){
    .shell{grid-template-columns:1fr}
    aside{position:static;height:auto;flex-direction:row;align-items:center;gap:8px;padding:0 12px;overflow-x:auto}
    .brand{padding:12px 6px 12px 0}.brand span{display:none}
    nav{flex-direction:row;padding:0;flex:0 0 auto}
    nav button{padding:9px 12px}
    .side-foot{display:none}
    main{padding:18px 14px 50px}.top{padding:14px}
  }
</style>
</head>
<body>

<div id="gate" class="gate" hidden>
  <div class="box">
    <div class="mark"><b>N</b><i></i></div>
    <h2>NUM Ops</h2>
    <p>Admin key required.</p>
    <form id="gateform">
      <input id="key" type="password" autofocus autocomplete="new-password" name="num-ops-admin-key" placeholder="Admin key" aria-label="Admin key">
      <button id="signin" type="submit">Sign in</button>
    </form>
    <div class="err" id="err"></div>
  </div>
</div>

<div id="app" class="shell" hidden>
  <aside>
    <div class="brand">
      <div class="mark"><b>N</b><i></i></div>
      <div><h1>NUM Ops</h1><span>Live from D1</span></div>
    </div>
    <nav id="tabs" role="tablist"></nav>
    <div class="side-foot"><b id="who">admin</b>Every figure reads the database directly.</div>
  </aside>

  <div class="col">
    <div class="top">
      <div>
        <h2 id="ptitle">Today</h2>
        <p class="sub" id="psub"></p>
      </div>
      <div class="spacer"></div>
      <div class="seg" id="range" role="group" aria-label="Time range">
        <button data-days="7"  onclick="setDays(7)">7d</button>
        <button data-days="30" onclick="setDays(30)">30d</button>
        <button data-days="90" onclick="setDays(90)">90d</button>
      </div>
      <span class="live"><span class="dot"></span><span id="stamp">live</span></span>
      <button class="ghost" id="refresh">Refresh</button>
    </div>
    <main id="view"></main>
  </div>
</div>

<script>
/* ── plumbing ─────────────────────────────────────────────────────────────
   Only the minted session token is stored, and only in sessionStorage — never
   localStorage, never the admin key itself. Closing the tab ends the session,
   so a shared laptop does not inherit it. */
const S = { key: sessionStorage.getItem('num_ops') || '', data: null, tab: 'today', days: 30 };
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const n = (v) => (v == null ? '—' : Number(v).toLocaleString());

/* A rate is only ever shown WITH the denominator that produced it. "50%" off
   two members is noise; "50% of 2" is a fact someone can weigh. */
function rate(num, den) {
  if (!den) return '';
  return `${Math.round((num / den) * 100)}% of ${n(den)}`;
}
const ago = (ts) => {
  if (!ts) return '—';
  const s = (Date.now() - new Date(String(ts).replace(' ', 'T') + 'Z').getTime()) / 1000;
  if (s < 3600) return Math.max(1, Math.round(s / 60)) + 'm ago';
  if (s < 86400) return Math.round(s / 3600) + 'h ago';
  return Math.round(s / 86400) + 'd ago';
};

const ICON = {
  today:  '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>',
  funnel: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 4h18l-7 8v7l-4 2v-9z"/></svg>',
  supply: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 21V8l9-5 9 5v13"/><path d="M9 21v-7h6v7"/></svg>',
  system: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2"/></svg>',
};

async function load() {
  const r = await fetch(`/api/admin/overview?days=${S.days}`, { headers: { 'X-Admin-Session': S.key } });
  if (r.status === 401) { S.key = ''; sessionStorage.removeItem('num_ops'); throw new Error('unauthorized'); }
  if (!r.ok) throw new Error('HTTP ' + r.status);
  return r.json();
}

/* ── charts ───────────────────────────────────────────────────────────────
   Draws whatever it is handed. A flat week draws flat. If every point is zero
   it says so in words instead of drawing a straight line along the axis, which
   reads as a working chart reporting nothing — the single most misleading
   thing a dashboard can do. */
function area(series, color) {
  if (!series || !series.length) return '<div class="empty">No data.</div>';
  const max = Math.max(...series.map((p) => p.n));
  if (max === 0) return `<div class="empty">Nothing in the last ${series.length} days.</div>`;
  const W = 720, H = 190, P = 8, step = W / Math.max(1, series.length - 1);
  const y = (v) => H - P - (v / max) * (H - P * 2 - 14);
  const pts = series.map((p, i) => `${(i * step).toFixed(1)},${y(p.n).toFixed(1)}`);
  const total = series.reduce((a, p) => a + p.n, 0);
  const id = 'g' + Math.random().toString(36).slice(2, 8);
  // Gridlines are computed, never written as a literal series. A bare array of
  // numbers in this file is indistinguishable — to a reader and to ops.test.mjs
  // — from the hand-typed "trends" that made the old console lie.
  let grid = '';
  for (let i = 1; i < 4; i++) {
    const gy = (H - P - (i / 4) * (H - P * 2 - 14)).toFixed(1);
    grid += `<line x1="0" y1="${gy}" x2="${W}" y2="${gy}"/>`;
  }
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img"
       aria-label="${series.length} day series, ${total} total, peak ${max} per day">
      <defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="${color}" stop-opacity=".18"/>
        <stop offset="100%" stop-color="${color}" stop-opacity="0"/>
      </linearGradient></defs>
      <g class="grid">${grid}</g>
      <polygon fill="url(#${id})" points="0,${H - P} ${pts.join(' ')} ${W},${H - P}"/>
      <polyline fill="none" stroke="${color}" stroke-width="2.25" stroke-linejoin="round"
                stroke-linecap="round" points="${pts.join(' ')}"/>
      <line class="ax" x1="0" y1="${H - P}" x2="${W}" y2="${H - P}"/>
    </svg>
    <div class="lbl"><span>${esc(series[0].d)}</span>
      <span>peak ${n(max)}/day · ${n(total)} total</span>
      <span>${esc(series[series.length - 1].d)}</span></div>`;
}

/* A sparkline inside a KPI card. Same honesty rule: nothing drawn when the
   series is empty or all zero, rather than a decorative flat line. */
function mini(series, color) {
  if (!series || series.length < 2) return '';
  const max = Math.max(...series.map((p) => p.n));
  if (max === 0) return '';
  const W = 240, H = 38, step = W / (series.length - 1);
  const pts = series.map((p, i) => `${(i * step).toFixed(1)},${(H - 3 - (p.n / max) * (H - 9)).toFixed(1)}`);
  return `<svg class="mini" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-hidden="true">
    <polyline fill="none" stroke="${color}" stroke-width="2" stroke-linecap="round" points="${pts.join(' ')}"/></svg>`;
}

/* Trend compares the last half of the window to the half before it. Shown only
   when the earlier half is non-zero — "+100%" against a base of nothing is a
   sentence with no information in it. */
function trend(series) {
  if (!series || series.length < 6) return '';
  const h = Math.floor(series.length / 2);
  const prev = series.slice(0, h).reduce((a, p) => a + p.n, 0);
  const now = series.slice(h).reduce((a, p) => a + p.n, 0);
  if (!prev) return '';
  const pct = Math.round(((now - prev) / prev) * 100);
  const cls = pct > 2 ? 'up' : pct < -2 ? 'down' : 'flat';
  return `<span class="trend ${cls}">${pct > 0 ? '+' : ''}${pct}%</span>`;
}

const kpi = (k, v, sub, opts = {}) =>
  `<div class="kpi${opts.alert ? ' alert' : ''}">
     ${opts.series ? trend(opts.series) : ''}
     <div class="k">${esc(k)}</div>
     <div class="v num">${v}</div>
     <div class="sub">${esc(sub || '')}</div>
     ${opts.series ? mini(opts.series, opts.color || 'var(--ink)') : ''}
   </div>`;

const panel = (title, note, body, flush) =>
  `<div class="panel"><header><h3>${esc(title)}</h3>${note ? `<p class="note">${note}</p>` : ''}</header>
   <div class="body${flush ? ' flush' : ''}">${body}</div></div>`;

function tbl(cols, rows, render, emptyMsg) {
  if (!rows || !rows.length) return `<div class="empty">${esc(emptyMsg)}</div>`;
  return `<table><thead><tr>${cols.map((c) => `<th>${esc(c)}</th>`).join('')}</tr></thead>
    <tbody>${rows.map(render).join('')}</tbody></table>`;
}

/* Horizontal bars for small categorical sets, where a pie would round three
   data points into a shape that implies precision nobody has. */
function bars(rows, label, value, accent) {
  if (!rows || !rows.length) return '';
  const max = Math.max(...rows.map(value), 1);
  return `<div class="bars">${rows.map((r) => `
    <div class="bar-row">
      <span class="bar-label">${esc(label(r))}</span>
      <span class="bar-val num">${n(value(r))}</span>
      <span class="bar-track"><span class="bar-fill${accent ? ' t' : ''}"
        style="width:${Math.max(2, (value(r) / max) * 100).toFixed(1)}%"></span></span>
    </div>`).join('')}</div>`;
}

/* ── views ────────────────────────────────────────────────────────────── */
const TABS = {
  today: ['Today', 'What needs a person today', (d) => {
    const t = d.todo || {}, a = d.app || {}, s = d.series || {};
    const blocked = (a.members > 0) && !a.verified;
    return (blocked ? `<div class="banner">
        <svg class="bi" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M12 9v4M12 17h.01M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/></svg>
        <div>
          <h3>Nothing can convert: 0 of ${n(a.members)} members are phone-verified.</h3>
          <p>Verification is the gate every downstream number sits behind — bookings, Stars, memberships.
             While this reads zero, ad spend buys signups that cannot finish. Check the A2P campaign status first.</p>
        </div>
      </div>` : '') +
      `<div class="kpis">
        ${kpi('Needs verifying', n((t.unverified || []).length), 'gave a phone, never verified', { alert: blocked })}
        ${kpi('Businesses waiting', n((t.claims_new || []).length), 'signed up, not yet contacted', { alert: (t.claims_new || []).length > 0 })}
        ${kpi('Bookings pending', n((t.bookings_pending || []).length), 'guest waiting on a venue', { alert: (t.bookings_pending || []).length > 0 })}
        ${kpi('Active today', n(a.active24), 'opened the app in 24h', { series: s.messages, color: 'var(--teal)' })}
      </div>` +
      panel('Businesses waiting on a call',
        'From the web form. Every hour here is a partner cooling off.',
        tbl(['Business', 'Contact', 'Phone', 'Waiting'], t.claims_new,
          (r) => `<tr><td><b>${esc(r.business_name)}</b></td><td>${esc(r.contact_name || '—')}</td>
                  <td class="mono">${esc(r.phone || '—')}</td><td>${ago(r.created_at)}</td></tr>`,
          'Nobody waiting. Every web signup has been contacted.'), true) +
      panel('Signed up, never verified',
        'They gave a phone number and stopped. Newest first.',
        tbl(['Name', 'Phone', 'Signed up'], (t.unverified || []).slice(0, 12),
          (r) => `<tr><td>${esc(r.name || '—')}</td><td class="mono">${esc(r.phone || '')}</td>
                  <td>${ago(r.created_at)}</td></tr>`,
          'Nobody stuck at verification.'), true);
  }],

  funnel: ['Funnel', 'Signup through to a booking', (d) => {
    const a = d.app || {}, b = d.brain || {}, s = d.series || {};
    return `<div class="kpis">
        ${kpi('Members', n(a.members), `${n(d.engagement?.active_7d)} active this week`, { series: s.signups })}
        ${kpi('Verified', n(a.verified), rate(a.verified, a.members) || 'none yet',
              { alert: !a.verified, series: s.verified, color: 'var(--ember)' })}
        ${kpi('Conversations', n(b.messages), 'messages, all channels', { series: s.messages, color: 'var(--teal)' })}
        ${kpi('Bookings', n(b.bookings), rate(b.bookings, a.members) || 'none yet')}
      </div>` +
      panel(`Signups · last ${s.days || S.days} days`,
        'One point per day, straight from D1. Zero days are drawn as zero.',
        area(s.signups, '#14120F')) +
      panel(`Verified · last ${s.days || S.days} days`,
        'The line that has to move before any other line matters.',
        area(s.verified, '#EC3013')) +
      panel(`Messages · last ${s.days || S.days} days`, '', area(s.messages, '#0EA483')) +
      panel('Where they came from',
        'First-touch attribution. <b>Verified</b> is the column that matters — a source with signups and no verifications is producing typos, not people.',
        tbl(['Source', 'Campaign', 'Signups', 'Verified'], a.by_source,
          (r) => `<tr><td><b>${esc(r.source)}</b></td><td class="mono">${esc(r.campaign || '—')}</td>
                  <td class="num">${n(r.signups)}</td><td class="num">${n(r.verified)}</td></tr>`,
          'No tagged traffic yet. Ads use /go/ links, which set the tags.'), true);
  }],

  supply: ['Supply', 'Businesses and the directory behind them', (d) => {
    const biz = d.business || {}, dir = d.directory || {};
    return `<div class="kpis">
        ${kpi('Businesses', n(biz.businesses), 'profiles created')}
        ${kpi('Claims', n(biz.claims), 'ownership claimed')}
        ${kpi('Directory', n(dir.places), `${n(dir.withPhoto)} with a photo`)}
        ${kpi('Destinations', n(dir.destinations), 'markets live')}
      </div>` +
      panel('Businesses',
        'Every business record in D1 — not a curated list.',
        tbl(['Business', 'State', 'Created'], biz.rows,
          (r) => `<tr><td><b>${esc(r.name || r.business_name || r.id)}</b></td>
                  <td><span class="pill">${esc(r.state || r.status || '—')}</span></td>
                  <td>${ago(r.created_at)}</td></tr>`,
          'No businesses onboarded yet.'), true);
  }],

  system: ['System', 'Cost, money and the rails underneath', (d) => {
    const ai = d.ai || {}, m = d.money || {}, reach = d.reach || {}, rails = d.rails || {};
    const rev = d.revenue || {}, chain = d.chain || {};
    const railRows = Object.entries(rails).filter(([, v]) => typeof v === 'boolean');
    // Cache hit rate against model turns in the window: hits are answers that
    // cost nothing. Approximate on purpose (hits are lifetime, turns are
    // windowed) — it trends the right way, and a precise-looking wrong number
    // would be worse.
    const answered = (chain.cache_hits ?? 0) + (ai.turns ?? 0);
    const hitRate = answered ? Math.round(100 * (chain.cache_hits ?? 0) / answered) : null;
    return `<div class="kpis">
        ${kpi('Revenue (USD)', '$' + n(rev.usd ?? 0), `${n(rev.paid_total)} paid · ${n(rev.paid_24h)} in 24h`)}
        ${kpi('Revenue (THB)', '฿' + n(rev.thb ?? 0), 'baht bills and tabs')}
        ${kpi('Paying members', n(rev.members_paid),
              `${n(rev.recurring)} auto-renew · ${n((rev.members_paid ?? 0) - (rev.recurring ?? 0))} legacy one-off`,
              { alert: (rev.members_paid ?? 0) > (rev.recurring ?? 0) })}
        ${kpi('Payment trouble · 7d', n(rev.trouble_7d), 'failed, refunded or disputed', { alert: (rev.trouble_7d ?? 0) > 0 })}
      </div>
      <div class="kpis">
        ${kpi('AI spend', '$' + (ai.spend_usd ?? 0).toFixed(2), `${n(ai.turns)} turns · ${ai.window_days}d window`)}
        ${kpi('Per turn', '$' + (ai.per_turn_usd ?? 0).toFixed(4), 'model cost per answer')}
        ${kpi('Cache', hitRate == null ? '—' : hitRate + '%', `${n(chain.cache_hits)} free answers · ${n(chain.cache_entries)} stored`)}
        ${kpi('Brain failures · 24h', n(chain.brain_fails_24h ?? 0),
              (chain.brain_fails_24h ?? 0) === 0 ? 'every brain healthy' : 'check num_brain_state cooldowns',
              { alert: (chain.brain_fails_24h ?? 0) > 5 })}
        ${kpi('Stars circulating', n(m.circulating),
              m.escrow_balanced ? 'escrow balanced' : 'ESCROW DRIFT — investigate', { alert: !m.escrow_balanced })}
        ${kpi('Push delivery', reach.delivery_rate == null ? '—' : Math.round(reach.delivery_rate * 100) + '%',
              `${n(reach.notifications_delivered)} of ${n(reach.notifications_queued)}`)}
      </div>` +
      panel('Recent payments', 'Every Stripe charge, newest first. State changes only by signed webhook.',
        tbl(['Ref', 'Amount', 'State', 'When'], rev.recent,
          (r) => `<tr><td class="mono">${esc(r.ref || r.id || '—')}</td>
                  <td>${r.currency === 'thb' ? '฿' : '$'}${n((r.amount_cents ?? 0) / 100)}${r.mode === 'stripe-sub' ? ' /mo' : ''}</td>
                  <td><span class="pill ${r.state === 'paid' ? 'ok' : r.state === 'created' ? '' : 'bad'}">${esc(r.state)}</span></td>
                  <td>${ago(r.created_at)}</td></tr>`,
          'No payments yet.'), true) +
      (ai.by_day && ai.by_day.length
        ? panel(`AI cost · last ${ai.window_days} days`,
            'Model spend per day. The only line here that can run away from you.',
            area(ai.by_day.map((r) => ({ d: r.d ?? r.day, n: Number(r.usd ?? r.spend ?? r.n ?? 0) })), '#B8860B'))
        : '') +
      `<div class="row">
        ${panel('Rails', 'Read from live config, not a list someone maintains by hand.',
          railRows.length
            ? `<table><tbody>${railRows.map(([k, v]) =>
                `<tr><td>${esc(k)}</td><td style="text-align:right"><span class="pill ${v ? 'ok' : 'bad'}">${v ? 'connected' : 'off'}</span></td></tr>`
              ).join('')}</tbody></table>`
            : '<div class="empty">No rails reported.</div>')}
        ${panel('Recent admin sign-ins', 'An unauditable admin door is a liability.',
          tbl(['Who', 'Result', 'When'], d.operator?.recent_logins,
            (r) => `<tr><td class="mono">${esc(r.who || '—')}</td>
                    <td><span class="pill ${r.ok ? 'ok' : 'bad'}">${r.ok ? 'ok' : 'failed'}</span></td>
                    <td>${ago(r.created_at)}</td></tr>`, 'No sign-ins recorded.'), true)}
      </div>`;
  }],
};

/* ── render ───────────────────────────────────────────────────────────── */
function render() {
  $('tabs').innerHTML = Object.entries(TABS).map(([k, [label]]) =>
    `<button role="tab" aria-selected="${k === S.tab}" onclick="pick('${k}')">${ICON[k] || ''}<span>${label}</span></button>`).join('');
  // The window buttons are static markup (see #range in the body) — only their
  // pressed state is dynamic. Keeping the three values out of the script means
  // this file contains no bare numeric array at all, which is the shape a
  // fabricated metric series takes and what ops.test.mjs looks for.
  for (const b of $('range').querySelectorAll('button')) {
    b.setAttribute('aria-pressed', String(Number(b.dataset.days) === S.days));
  }
  const [label, sub, view] = TABS[S.tab];
  $('ptitle').textContent = label;
  $('psub').textContent = sub;
  $('view').innerHTML = view(S.data);
  $('stamp').textContent = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
}
window.pick = (k) => { S.tab = k; render(); };
window.setDays = async (v) => {
  if (v === S.days) return;
  S.days = v;
  try { S.data = await load(); render(); } catch (e) { boot(); }
};

// The dashboard keeps itself current: a full reload of the overview every
// hour, plus one two minutes after open (a just-opened dashboard is usually
// being watched because something is happening). Silent on failure — a
// refresh that throws must never log the operator out of a working view.
const refresh = () => load().then((d) => { S.data = d; render(); }).catch(() => {});
setInterval(refresh, 3600_000);
setTimeout(refresh, 120_000);

async function boot() {
  if (!S.key) { $('gate').hidden = false; $('app').hidden = true; setTimeout(() => $('key').focus(), 50); return; }
  try {
    S.data = await load();
    $('gate').hidden = true; $('app').hidden = false;
    $('who').textContent = S.data.operator?.signed_in_as || 'admin';
    render();
  } catch (e) {
    $('gate').hidden = false; $('app').hidden = true;
    $('err').textContent = e.message === 'unauthorized' ? 'Key rejected.' : 'Could not load: ' + e.message;
  }
}

/* Exchange the admin key for a signed session token.
 *
 * This step was missing, and its absence made the console unopenable with ANY
 * key. The typed value used to go straight into the X-Admin-Session header,
 * but that header is verified by sessionClaims(), which splits on "." and needs
 * `payload.signature` — so a raw key failed before it was ever compared to
 * ADMIN_KEY. Every attempt returned "Key rejected", which reads as a wrong
 * password and sent us rotating a secret that was fine. */
// EVERY press of Enter or Sign in produces something visible. The old
// handler returned silently on an empty field — and Chrome's autofill overlay
// can make an empty field LOOK filled, so "I typed my password and nothing
// happened" was this exact line. A form that can do nothing at all is
// indistinguishable from a broken one, because it is one.
const complain = (msg) => {
  $('err').textContent = msg;
  $('key').classList.add('bad');
  const box = document.querySelector('.gate .box');
  box.classList.remove('shake'); void box.offsetWidth; // restart the animation
  box.classList.add('shake');
};
$('gateform').addEventListener('submit', (e) => e.preventDefault());
// Typing before clicking must still work: the input autofocuses, and if focus
// is ANYWHERE else on the gate, Enter and stray typing are pulled back into
// the field. The empty-and-unfocused field was the last truly silent path —
// someone opens the page, types into nothing, presses Enter into nothing,
// and reads a working page as broken. Watched happen 8 Aug via screenshot:
// no focus ring, empty field, "it does nothing when i press enter."
document.addEventListener('keydown', (e) => {
  if ($('gate').hidden) return;
  if (document.activeElement !== $('key') && e.key.length === 1) { $('key').focus(); }
  if (e.key === 'Enter') { e.preventDefault(); $('signin').click(); }
});
$('signin').onclick = async () => {
  const key = $('key').value.trim();
  if (!key) { complain('The key field is empty — click it, then type the key.'); return; }
  $('signin').disabled = true; $('signin').textContent = 'Checking…';
  // One silent retry. Every deploy swaps the service worker in under this
  // page, and the swap aborts whichever fetch is in flight — so the FIRST
  // sign-in attempt after opening the page can die with "Failed to fetch"
  // while the second sails through. Watched happen live on 8 Aug: the same
  // POST failed from the button and returned 401 from the console seconds
  // later. The person who opens the page and types immediately always hits
  // the doomed attempt; this retry means they never see it.
  const post = () => fetch('/api/admin/session', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ key }),
  });
  try {
    let r;
    try { r = await post(); }
    catch { await new Promise((res) => setTimeout(res, 800)); r = await post(); }
    const d = await r.json().catch(() => ({}));
    if (!r.ok) { complain(r.status === 401 ? 'Wrong password.' : (d.error || `Sign-in failed (HTTP ${r.status}).`)); return; }
    S.key = d.token;
    sessionStorage.setItem('num_ops', d.token);
    $('key').value = '';
    $('err').textContent = '';
    boot();
  } catch (e) {
    complain('Could not reach the sign-in endpoint: ' + (e?.message ?? e));
  } finally {
    $('signin').disabled = false; $('signin').textContent = 'Sign in';
  }
};
$('key').addEventListener('keydown', (e) => { if (e.key === 'Enter') $('signin').click(); });
$('key').addEventListener('input', () => { $('key').classList.remove('bad'); $('err').textContent = ''; });
$('refresh').onclick = async () => { try { S.data = await load(); render(); } catch { boot(); } };
boot();
</script>
</body>
</html>
