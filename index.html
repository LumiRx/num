<!doctype html>
<html lang="en" data-theme="verified">
  <head>
    <meta charset="UTF-8" />
    <!-- interactive-widget: on browsers that support it the keyboard resizes the
         layout viewport natively, so 100dvh is already correct and the JS below
         never has to intervene. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="description" content="Num — your concierge. One thread, one calendar, zero forms." />
    <!-- Matches the aurora's top colour so the status bar blends into the app -->
    <meta name="theme-color" content="#ffffff" />
    <script>try{if(matchMedia("(prefers-color-scheme: dark)").matches){var s=localStorage.getItem("num-trip-v1");var th=s&&JSON.parse(s).theme;if(!th||th==="auto"||th==="verified-dark"){document.documentElement.setAttribute("data-theme","verified-dark")}}}catch(e){}</script>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <!-- The first row of TODAY, fetched while the JS is still downloading:
         the tiles paint with the grid instead of a beat after it. Only the
         two above-the-fold covers — preloading more competes with the bundle. -->
    <link rel="preload" as="image" href="/covers/flights-sm.webp" type="image/webp" fetchpriority="high" />
    <link rel="preload" as="image" href="/covers/stays-sm.webp" type="image/webp" fetchpriority="high" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- iOS home-screen install: full-screen, dark status-bar text on our light ground -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Num" />
    <title>NUM</title>
      <!-- Cloudflare Web Analytics, via the worker so the token is config.
         Deferred and last: measurement must never cost the app a millisecond
         of first paint. -->
    <!-- Analytics and the tracker are loaded from main.tsx via apiUrl(), NOT with a
         bare absolute path. On iOS the web view origin is capacitor://localhost, so
         `/api/analytics.js` resolves against the LOCAL BUNDLE and 404s — the same
         class of bug documented at length in src/lib/apibase.ts, in the one place
         apiUrl() cannot reach because it is static HTML rather than JS. A bare tag
         here also makes Vite warn that it cannot bundle a non-module script.
         See src/lib/analyticsLoader.ts. -->
  <!-- THE PIXEL BELONGS HERE MORE THAN ANYWHERE ELSE ON THE ESTATE.
     This is the page the live Reddit campaign actually points at — 2,305 of
     the 3,479 visitors NUM has ever had landed on this exact URL. It had no
     ad pixel of any kind, on either network, so every one of those clicks was
     invisible to the thing that decides who sees the ad next.
     The conversions themselves are reported from num-track.js. -->
<!-- NOT IN THE APP STORE BUILD. This same index.html is bundled into the
     IPA, so an unguarded ad pixel means the iOS app contacts a third-party
     ad network for every user at launch with no App Tracking Transparency
     prompt in front of it — guideline 5.1.2, and a rejection that has
     nothing to do with advertising working correctly on the web.

     The guard is the ORIGIN, not the Capacitor bridge: this runs in <head>
     before any bundle has loaded, and the bridge may not have injected yet.
     capacitor:// and localhost are the app; anything else is the web. Kept
     in step with nativeOrigin() in src/lib/native.ts — src/lib/pixel.test.mjs
     fails if the two drift apart. -->
<!-- Reddit Pixel -->
<script>
(function(){try{var l=window.location;if(l.protocol==='capacitor:'||l.protocol==='ionic:'||l.hostname==='localhost'||l.hostname==='127.0.0.1')return;}catch(e){return}
!function(w,d){if(!w.rdt){var p=w.rdt=function(){p.sendEvent?p.sendEvent.apply(p,arguments):p.callQueue.push(arguments)};p.callQueue=[];var t=d.createElement("script");t.src="https://www.redditstatic.com/ads/pixel.js?pixel_id=a2_jgfeykixrdo7",t.async=!0;var s=d.getElementsByTagName("script")[0];s.parentNode.insertBefore(t,s)}}(window,document);rdt('init','a2_jgfeykixrdo7');rdt('track', 'PageVisit');
})();
</script>

</head>
  <body>
    <div id="root"></div>
    <script>
      // Captured HERE, not in React: Chrome fires beforeinstallprompt once,
      // early — often before the bundle has parsed. Miss it and the one-tap
      // install is gone for the whole visit; every "Add to home screen"
      // button falls back to a manual instruction card on the exact devices
      // that support doing it natively. e.preventDefault() also stops
      // Chrome's own mini-infobar so the ONLY prompt the guest sees is the
      // one our button triggers.
      window.addEventListener('beforeinstallprompt', function (e) {
        e.preventDefault();
        window.__numInstall = e;
        window.dispatchEvent(new Event('num-installable'));
      });
      window.addEventListener('appinstalled', function () {
        window.__numInstall = null;
        window.dispatchEvent(new Event('num-installed'));
      });
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
