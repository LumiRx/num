<title>Num — Num Experts</title>
<meta name="robots" content="noindex,follow">
<link rel="canonical" href="https://app.itsnum.com/scout/">
<!--
  THIS PAGE IS A SIGNPOST. THE REAL ONE IS ON app.itsnum.com.

  17 Sep 2026, and the reason nobody had ever signed up as a Num Expert
  through the web.

  The full page used to live here, at itsnum.com/scout, served by num-console
  out of public/. Every call it made — the signup form, the dashboard, the
  paperwork — went to a relative /api/... path. There is no /api on this host.
  Checked live:

      itsnum.com/api/scouts/terms       404
      itsnum.com/api/version            404
      itsnum.com/api/ev                 404
      app.itsnum.com/api/scouts/terms   200

  So the form 404'd every time it was submitted, in silence, from the day it
  was written. Both Experts in the database were put there by hand with SQL.

  The page now lives in app-public/scout/, which num-app publishes at
  app.itsnum.com/scout/ — the same origin as the API. That matters beyond
  tidiness: the sign-in session is an HttpOnly cookie, and serving the page
  from a different host would make it a third-party cookie, which Safari drops.
  Same origin means it simply works.

  This file stays because itsnum.com/scout is the address in the docs, on the
  cards and in what has already been sent to people. It redirects rather than
  duplicating the page, so there is only ever one copy to keep correct.

  The query string is carried across so a sign-in link that lands here still
  works. The <meta refresh> and the real <a> are for anything that does not
  run the script — a redirect nobody can follow without JavaScript is a dead
  end, not a redirect.
-->
<meta http-equiv="refresh" content="0; url=https://app.itsnum.com/scout/">
<script>
  location.replace('https://app.itsnum.com/scout/' + location.search);
</script>
<style>
  body{font-family:system-ui,-apple-system,"Plus Jakarta Sans",sans-serif;margin:0;
       min-height:100vh;display:flex;align-items:center;justify-content:center;
       padding:24px;text-align:center;color:#201e1d;background:#faf7f4}
  a{color:#ec3013;font-weight:700}
</style>
</head>
<body>
  <p>
    The Num Expert dashboard has moved.<br>
    <a href="https://app.itsnum.com/scout/">Open it here</a>.
  </p>
</body>
</html>
