<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0f1e">
<title>NUM — Mobile Console (prototype)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<!--
  NUM mobile management prototype — all six roles, EN/TH, dark AEROZ aesthetic.
  Single file, zero dependencies, in-memory state only.
  Open on a phone for the real feel; desktop renders a phone frame.
  Pairs with MOBILE_UI_SPEC.md. Data shapes mirror the live Supabase schema.
-->
<style>
  :root{
    --bg-0:#0a0f1e;        /* midnight */
    --bg-1:#101828;        /* card */
    --bg-2:#182238;        /* raised */
    --line:#22304d;
    --line-soft:#1b2740;
    --ink:#f4f7fd;         /* primary text */
    --ink-2:#aeb9d2;       /* secondary */
    --ink-3:#71809f;       /* tertiary */
    --teal:#2fd4c2;
    --teal-deep:#128d80;
    --sand:#e8cf9f;
    --coral:#ff6f61;
    --green:#3ddc97;
    --amber:#ffc466;
    --wa:#25d366; --ln:#06c755; --wc:#09b83e; --sm:#8a97b5;
    --r:16px; --r-s:10px;
    --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px; --s6:32px;
    --tabbar-h:62px;
    --font:"Inter","Noto Sans Thai","Sukhumvit Set",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html{font-size:16px}
  body{
    background:#05080f;color:var(--ink);
    font-family:var(--font);
    font-feature-settings:"cv05","cv08";
    -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
    min-height:100vh;display:flex;justify-content:center;align-items:flex-start;
    line-height:1.5;
  }
  /* ---- phone frame on desktop ---- */
  #phone{width:100%;max-width:430px;min-height:100vh;background:var(--bg-0);position:relative;display:flex;flex-direction:column}
  @media(min-width:768px){
    body{padding:28px 0;background:radial-gradient(1200px 600px at 50% -100px,#12203f 0%,#05080f 60%)}
    #phone{min-height:860px;max-height:92vh;border-radius:44px;border:8px solid #1c2438;box-shadow:0 40px 90px rgba(0,0,0,.6);overflow:hidden}
  }
  /* ---- header ---- */
  header{
    position:sticky;top:0;z-index:30;background:linear-gradient(180deg,rgba(10,15,30,.98),rgba(10,15,30,.92));
    backdrop-filter:blur(10px);border-bottom:1px solid var(--line-soft);
    padding:calc(env(safe-area-inset-top) + 12px) var(--s4) var(--s3);
    display:flex;align-items:center;gap:10px;
  }
  .logo{font-weight:800;font-size:19px;letter-spacing:-.02em}
  .logo em{color:var(--teal);font-style:normal}
  #roleBtn{
    display:flex;align-items:center;gap:6px;background:var(--bg-2);border:1px solid var(--line);
    color:var(--ink);border-radius:999px;padding:8px 13px;font-size:13px;font-weight:600;cursor:pointer;min-height:38px;font-family:var(--font)
  }
  #roleBtn .car{color:var(--ink-3);font-size:9px}
  .hdr-spacer{flex:1}
  #langBtn{
    background:none;border:1px solid var(--line);color:var(--ink-2);border-radius:999px;
    padding:8px 12px;font-size:12px;font-weight:700;cursor:pointer;min-height:38px;font-family:var(--font)
  }
  #langBtn b{color:var(--teal)}
  .livedot{width:9px;height:9px;border-radius:50%;background:var(--green);box-shadow:0 0 0 0 rgba(61,220,151,.5);animation:pulse 2s infinite}
  @keyframes pulse{70%{box-shadow:0 0 0 8px rgba(61,220,151,0)}}
  /* ---- main scroll ---- */
  main{flex:1;overflow-y:auto;padding:var(--s4) var(--s4) calc(var(--tabbar-h) + env(safe-area-inset-bottom) + 24px);scroll-behavior:smooth}
  .asof{font-size:11px;color:var(--ink-3);text-align:center;margin:var(--s4) 0 var(--s1)}
  /* ---- bottom tabs ---- */
  nav{
    position:absolute;left:0;right:0;bottom:0;z-index:30;height:calc(var(--tabbar-h) + env(safe-area-inset-bottom));
    background:rgba(13,19,38,.97);backdrop-filter:blur(12px);border-top:1px solid var(--line-soft);
    display:flex;padding:0 var(--s1) env(safe-area-inset-bottom)
  }
  nav button{
    flex:1;background:none;border:none;color:var(--ink-3);font-size:10.5px;font-weight:600;cursor:pointer;font-family:var(--font);
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-height:var(--tabbar-h);position:relative
  }
  nav button .ico{font-size:19px;line-height:1;filter:grayscale(.35);opacity:.8}
  nav button.on{color:var(--teal)}
  nav button.on .ico{filter:none;opacity:1;transform:translateY(-1px)}
  nav button.on::after{content:"";position:absolute;top:0;left:26%;right:26%;height:2.5px;border-radius:0 0 3px 3px;background:var(--teal)}
  /* ---- cards & tiles ---- */
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:var(--s3)}
  .tile{background:var(--bg-1);border:1px solid var(--line-soft);border-radius:var(--r);padding:var(--s4);box-shadow:0 1px 2px rgba(0,0,0,.25)}
  .tile .lb{font-size:11px;color:var(--ink-3);font-weight:600;letter-spacing:.04em;text-transform:uppercase;margin-bottom:var(--s2)}
  .tile .v{font-size:30px;font-weight:700;letter-spacing:-.03em;line-height:1}
  .tile .d{font-size:12px;margin-top:var(--s2);font-weight:600}
  .up{color:var(--green)} .down{color:var(--coral)} .flat{color:var(--ink-3)}
  .sparkbox{margin-top:var(--s3);height:30px}
  .sparkbox svg{display:block;width:100%;height:30px}
  .card{background:var(--bg-1);border:1px solid var(--line-soft);border-radius:var(--r);padding:var(--s4);margin-bottom:var(--s3);box-shadow:0 1px 2px rgba(0,0,0,.25)}
  .card.tap{cursor:pointer;transition:background .12s}
  .card.tap:active{background:var(--bg-2)}
  .card h3{font-size:14.5px;font-weight:600;margin-bottom:2px;letter-spacing:-.01em}
  .rowline{display:flex;align-items:center;gap:var(--s2)}
  .rowline .grow{flex:1;min-width:0}
  .sub{font-size:13px;color:var(--ink-2);line-height:1.5}
  .tiny{font-size:11px;color:var(--ink-3)}
  .num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum";letter-spacing:-.02em;font-weight:700}
  .sec{margin:var(--s5) 0 var(--s3);display:flex;align-items:baseline;gap:var(--s2)}
  .sec:first-child{margin-top:var(--s1)}
  .sec h2{font-size:16px;font-weight:700;letter-spacing:-.02em}
  .sec .hint{font-size:11.5px;color:var(--ink-3);margin-left:auto}
  .chart-note{font-size:11.5px;color:var(--ink-3);margin:-4px 0 var(--s3);line-height:1.45}
  /* ---- chips & badges ---- */
  .chip{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:3px 9px;font-size:11px;font-weight:700;white-space:nowrap}
  .chip.teal{background:rgba(47,212,194,.14);color:var(--teal)}
  .chip.sand{background:rgba(232,207,159,.14);color:var(--sand)}
  .chip.coral{background:rgba(255,111,97,.16);color:var(--coral)}
  .chip.green{background:rgba(61,220,151,.14);color:var(--green)}
  .chip.amber{background:rgba(255,196,102,.15);color:var(--amber)}
  .chip.grey{background:rgba(138,151,181,.15);color:var(--ink-2)}
  .bdg{display:inline-flex;align-items:center;border-radius:6px;padding:2px 6px;font-size:10px;font-weight:800;letter-spacing:.03em}
  .b-wa{background:rgba(37,211,102,.15);color:var(--wa)}
  .b-ln{background:rgba(6,199,85,.15);color:var(--ln)}
  .b-wc{background:rgba(9,184,62,.15);color:var(--wc)}
  .b-sm{background:rgba(138,151,181,.18);color:var(--sm)}
  .b-lang{background:rgba(232,207,159,.13);color:var(--sand)}
  .score{width:26px;height:26px;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;font-weight:800;font-size:13px}
  .score.A{background:rgba(61,220,151,.16);color:var(--green)}
  .score.B{background:rgba(255,196,102,.16);color:var(--amber)}
  .score.C{background:rgba(138,151,181,.16);color:var(--ink-2)}
  .dot{width:8px;height:8px;border-radius:50%;display:inline-block}
  .dot.g{background:var(--green)} .dot.a{background:var(--amber)} .dot.r{background:var(--coral)}
  /* ---- buttons ---- */
  .btn{border:none;border-radius:11px;padding:11px 16px;font-size:13.5px;font-weight:700;cursor:pointer;min-height:42px}
  .btn.primary{background:var(--teal);color:#04211d}
  .btn.primary:active{background:var(--teal-deep)}
  .btn.ghost{background:none;border:1px solid var(--line);color:var(--ink-2)}
  .btn.danger{background:none;border:1px solid rgba(255,111,97,.4);color:var(--coral)}
  .btn.small{padding:8px 13px;min-height:36px;font-size:12.5px;border-radius:9px}
  .btn.done{background:rgba(61,220,151,.15);color:var(--green);pointer-events:none}
  .btnrow{display:flex;gap:8px;margin-top:11px}
  .btnrow .btn{flex:1}
  /* ---- viz ---- */
  .chart{margin:var(--s3) 0 var(--s1)}
  .chart svg{display:block;width:100%;height:auto}
  .chart text{font-family:var(--font)}
  .legend{display:flex;flex-wrap:wrap;gap:var(--s2) var(--s3);margin-top:var(--s3)}
  .legend .key{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-2)}
  .legend .key b{color:var(--ink);font-variant-numeric:tabular-nums}
  .key i{width:10px;height:10px;border-radius:3px;display:inline-block;flex:none}
  .donut-wrap{display:flex;align-items:center;gap:var(--s4)}
  .donut-wrap svg{flex:none}
  .donut-legend{flex:1;display:flex;flex-direction:column;gap:7px}
  .donut-legend .key{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--ink-2)}
  .donut-legend .key .pc{margin-left:auto;font-variant-numeric:tabular-nums;font-weight:600;color:var(--ink)}
  .funnel-row{display:flex;align-items:center;gap:var(--s3);margin-bottom:6px}
  .funnel-row .fl{width:96px;font-size:12px;color:var(--ink-2);flex:none;line-height:1.3}
  .funnel-row .ftrack{flex:1;height:22px;background:var(--bg-2);border-radius:7px;overflow:hidden}
  .funnel-row .fbar{height:100%;border-radius:7px;display:flex;align-items:center;justify-content:flex-end;padding-right:7px;min-width:34px}
  .funnel-row .fbar b{font-size:11.5px;color:#04211d;font-variant-numeric:tabular-nums}
  .funnel-conv{display:flex;align-items:center;gap:var(--s3);margin:1px 0 5px}
  .funnel-conv .fl{width:96px;flex:none}
  .funnel-conv span{font-size:10.5px;color:var(--ink-3);font-variant-numeric:tabular-nums}
  .meter{height:8px;border-radius:99px;background:var(--bg-2);overflow:hidden;margin-top:var(--s2)}
  .meter i{display:block;height:100%;border-radius:99px}
  /* ---- transcript ---- */
  .msg{max-width:86%;border-radius:14px;padding:10px 13px;font-size:13.5px;line-height:1.5;margin-bottom:var(--s2)}
  .msg.user{background:var(--bg-2);border:1px solid var(--line)}
  .msg.ai{background:rgba(47,212,194,.1);border:1px solid rgba(47,212,194,.25);margin-left:auto}
  .msg .who{font-size:10px;font-weight:800;color:var(--ink-3);margin-bottom:3px;letter-spacing:.06em}
  .toolcall{font-size:11px;color:var(--sand);background:rgba(232,207,159,.08);border:1px dashed rgba(232,207,159,.3);border-radius:9px;padding:6px 10px;margin:8px auto 8px;width:fit-content}
  /* ---- sheet ---- */
  #ovl{position:absolute;inset:0;background:rgba(3,6,14,.6);z-index:40;opacity:0;pointer-events:none;transition:opacity .2s}
  #ovl.open{opacity:1;pointer-events:auto}
  #sheet{
    position:absolute;left:0;right:0;bottom:0;z-index:50;max-height:88%;background:var(--bg-1);
    border-radius:22px 22px 0 0;border:1px solid var(--line);border-bottom:none;
    transform:translateY(105%);transition:transform .25s cubic-bezier(.3,.9,.3,1);
    display:flex;flex-direction:column;
  }
  #sheet.open{transform:translateY(0)}
  #sheet .grab{width:44px;height:4px;border-radius:99px;background:var(--line);margin:10px auto 4px;flex:none}
  #sheetBody{overflow-y:auto;padding:10px 18px calc(24px + env(safe-area-inset-bottom))}
  #sheetBody h2{font-size:18px;margin:6px 0 2px}
  /* ---- role sheet rows ---- */
  .rolerow{display:flex;align-items:center;gap:12px;padding:13px 6px;border-bottom:1px solid var(--line);cursor:pointer}
  .rolerow:last-child{border-bottom:none}
  .rolerow .ico{font-size:22px;width:34px;text-align:center}
  .rolerow.on h3{color:var(--teal)}
  .rolerow .app{margin-left:auto}
  /* ---- misc ---- */
  .empty{padding:26px 14px;text-align:center;color:var(--ink-3);font-size:13px;line-height:1.5}
  .divider{height:1px;background:var(--line);margin:12px 0}
  .kvrow{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line);font-size:13.5px;gap:12px}
  .kvrow:last-child{border-bottom:none}
  .kvrow .k{color:var(--ink-2)}
  .kvrow .v{font-weight:600;text-align:right}
  .pillrow{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
  .stagebar{display:flex;gap:4px;margin-top:10px}
  .stagebar i{flex:1;height:6px;border-radius:99px;background:var(--bg-2)}
  .stagebar i.done{background:var(--teal)}
  .checkrow{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
  .checkrow:last-child{border-bottom:none}
  .checkrow .t{flex:1;min-width:0}
  .gradechips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
  .gradechips .chip{cursor:pointer;padding:8px 13px;font-size:12.5px;border:1px solid transparent}
  .gradechips .chip.sel{border-color:currentColor}
  .fade-enter{animation:fadeup .22s ease}
  @keyframes fadeup{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
  .toast{
    position:absolute;bottom:calc(var(--tabbar-h) + 18px);left:50%;transform:translateX(-50%) translateY(20px);
    background:var(--bg-2);border:1px solid var(--line);color:var(--ink);padding:10px 18px;border-radius:999px;
    font-size:13px;font-weight:600;opacity:0;transition:all .25s;z-index:60;white-space:nowrap
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<div id="phone">
  <header>
    <div class="logo">NU<em>M</em></div>
    <button id="roleBtn" onclick="openRoleSheet()"><span id="roleName">Operator</span><span class="car">▼</span></button>
    <div class="hdr-spacer"></div>
    <button id="langBtn" onclick="toggleLang()"><b id="langNow">EN</b>·<span id="langAlt">TH</span></button>
    <div class="livedot" title="realtime connected"></div>
  </header>
  <main id="main"></main>
  <nav id="tabbar"></nav>
  <div id="ovl" onclick="closeSheet()"></div>
  <div id="sheet"><div class="grab"></div><div id="sheetBody"></div></div>
  <div id="toast" class="toast"></div>
</div>

/* ================= SVG chart engine (no libs — offline-safe) ================= */
let _uid = 0;
function svgSpark(a, color="var(--teal)"){
  const id = "g"+(++_uid), W=100, H=30, m=Math.max(...a), lo=Math.min(...a);
  const span = (m-lo)||1;
  const pts = a.map((v,i)=>[ (i/(a.length-1))*W, 26 - ((v-lo)/span)*20 ]);
  const line = pts.map(p=>p.map(n=>n.toFixed(1)).join(",")).join(" ");
  const [lx,ly] = pts[pts.length-1];
  return `<div class="sparkbox"><svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
    <defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="${color}" stop-opacity=".28"/><stop offset="1" stop-color="${color}" stop-opacity="0"/>
    </linearGradient></defs>
    <polygon points="0,${H} ${line} ${W},${H}" fill="url(#${id})"/>
    <polyline points="${line}" fill="none" stroke="${color}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="${lx.toFixed(1)}" cy="${ly.toFixed(1)}" r="2.6" fill="${color}"/>
  </svg></div>`;
}
const spark = (a)=>svgSpark(a);

function svgDonut(parts, centerTop, centerSub){
  const R=44, C=2*Math.PI*R, size=118, cx=size/2, cy=size/2;
  let off=0;
  const segs = parts.map(p=>{
    const len = p.pct/100*C;
    const s = `<circle cx="${cx}" cy="${cy}" r="${R}" fill="none" stroke="${p.c}" stroke-width="15"
      stroke-dasharray="${(len-2).toFixed(1)} ${(C-len+2).toFixed(1)}" stroke-dashoffset="${(-off).toFixed(1)}"
      transform="rotate(-90 ${cx} ${cy})" stroke-linecap="butt"/>`;
    off += len;
    return s;
  }).join("");
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">
    ${segs}
    <text x="${cx}" y="${cy-3}" text-anchor="middle" font-size="21" font-weight="700" fill="var(--ink)" style="font-variant-numeric:tabular-nums">${centerTop}</text>
    <text x="${cx}" y="${cy+15}" text-anchor="middle" font-size="9.5" fill="var(--ink-3)">${centerSub}</text>
  </svg>`;
}

function svgStackedBars(labels, series, unit=""){
  const W=320, H=158, padL=36, padR=6, padT=16, padB=22;
  const cw=W-padL-padR, ch=H-padT-padB;
  const totals = labels.map((_,i)=>series.reduce((s,x)=>s+x.v[i],0));
  const rawMax = Math.max(...totals);
  const step = rawMax>100?50:rawMax>40?20:10;
  const yMax = Math.ceil(rawMax/step)*step || 10;
  const y = v => padT + ch - (v/yMax)*ch;
  const bw = Math.min(40, cw/labels.length*0.52);
  const grid = [0,.5,1].map(f=>{const v=yMax*f;return `
    <line x1="${padL}" x2="${W-padR}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line-soft)" stroke-width="1" ${f>0?'stroke-dasharray="3 4"':''}/>
    <text x="${padL-6}" y="${y(v)+3.5}" text-anchor="end" font-size="9.5" fill="var(--ink-3)" style="font-variant-numeric:tabular-nums">${v}${unit}</text>`;}).join("");
  const bars = labels.map((lb,i)=>{
    const xC = padL + cw*(i+0.5)/labels.length;
    let acc=0;
    const segs = series.map(s=>{
      const h=(s.v[i]/yMax)*ch, yy=y(acc+s.v[i]); acc+=s.v[i];
      return s.v[i]>0?`<rect x="${(xC-bw/2).toFixed(1)}" y="${yy.toFixed(1)}" width="${bw.toFixed(1)}" height="${Math.max(1.5,h).toFixed(1)}" rx="3" fill="${s.c}"/>`:"";
    }).join("");
    return `${segs}
      <text x="${xC}" y="${y(totals[i])-5}" text-anchor="middle" font-size="10" font-weight="700" fill="var(--ink-2)" style="font-variant-numeric:tabular-nums">${totals[i]}${unit}</text>
      <text x="${xC}" y="${H-6}" text-anchor="middle" font-size="10" fill="var(--ink-3)">${lb}</text>`;
  }).join("");
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}">${grid}${bars}</svg></div>`;
}

function svgLineTarget(points, target, opts={}){
  const W=320, H=140, padL=40, padR=14, padT=18, padB=22;
  const cw=W-padL-padR, ch=H-padT-padB;
  const vals=points.map(p=>p.v);
  const yMax=Math.max(target??0, ...vals)*1.2;
  const y=v=>padT+ch-(v/yMax)*ch, x=i=>padL+cw*(points.length===1?0.5:i/(points.length-1));
  const fmt=opts.fmt||(v=>v);
  const id="lg"+(++_uid);
  const line=points.map((p,i)=>`${x(i).toFixed(1)},${y(p.v).toFixed(1)}`).join(" ");
  const tgt = target!=null?`
    <line x1="${padL}" x2="${W-padR}" y1="${y(target)}" y2="${y(target)}" stroke="var(--coral)" stroke-width="1.3" stroke-dasharray="5 4" opacity=".8"/>
    <text x="${W-padR}" y="${y(target)-5}" text-anchor="end" font-size="9.5" fill="var(--coral)">${opts.targetLabel||("target "+fmt(target))}</text>`:"";
  const dots=points.map((p,i)=>`
    <circle cx="${x(i).toFixed(1)}" cy="${y(p.v).toFixed(1)}" r="3.4" fill="var(--bg-1)" stroke="var(--teal)" stroke-width="2.2"/>
    <text x="${x(i).toFixed(1)}" y="${y(p.v)-9}" text-anchor="middle" font-size="10" font-weight="700" fill="var(--ink-2)" style="font-variant-numeric:tabular-nums">${fmt(p.v)}</text>
    <text x="${x(i).toFixed(1)}" y="${H-6}" text-anchor="middle" font-size="10" fill="var(--ink-3)">${p.w}</text>`).join("");
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}">
    <defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--teal)" stop-opacity=".22"/><stop offset="1" stop-color="var(--teal)" stop-opacity="0"/>
    </linearGradient></defs>
    <polygon points="${x(0).toFixed(1)},${(padT+ch).toFixed(1)} ${line} ${x(points.length-1).toFixed(1)},${(padT+ch).toFixed(1)}" fill="url(#${id})"/>
    ${tgt}
    <polyline points="${line}" fill="none" stroke="var(--teal)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    ${dots}
  </svg></div>`;
}

function funnelViz(stages){
  const first=stages[0].v;
  return stages.map((f,i)=>{
    const wpct=Math.max(10, f.v/first*100);
    const conv = i>0 ? Math.round(f.v/stages[i-1].v*100) : null;
    return `${i>0?`<div class="funnel-conv"><span class="fl"></span><span>↓ ${conv}%</span></div>`:""}
      <div class="funnel-row"><span class="fl">${f.s}</span>
        <div class="ftrack"><div class="fbar" style="width:${wpct}%;background:${f.c}"><b>${f.v.toLocaleString()}</b></div></div>
      </div>`;
  }).join("");
}

    <div class="card" style="margin-bottom:8px"><div class="rowline">
      <div class="grow"><h3 style="font-size:13.5px">${esc(m.name)}</h3><div class="tiny">${m.cat} · ${m.days}d</div></div>
      ${freshChip(m.fresh)}<button class="btn small ghost" onclick="toast(t('nudged'))">${t("nudge")}</button>
    </div></div>`).join("");
  return `${sec(t("pendingTitle"),"")}${pend}
    ${sec(t("coverage"),"")}<div class="chart-note">${t("covNote")}</div>${cov}
    ${sec(t("staleTitle"),"")}${stale}
    ${sec(t("topPerf"),"")}<div class="card" style="border-color:rgba(61,220,151,.35)"><div class="rowline">
      <div class="grow"><h3>Kan Eang @ Pier</h3><div class="tiny">🦞 restaurant · 23 bookings · ฿84k GMV · NPS 71</div></div><span style="font-size:22px">🏆</span></div></div>`;
}
function scrMasterTraffic(){
  const donutParts=MASTER.chmix.map(c=>({pct:c.pct,c:c.c}));
  const legend=MASTER.chmix.map(c=>`<span class="key"><i style="background:${c.c}"></i>${c.l}<span class="pc">${c.pct}%</span></span>`).join("");
  const maxS=Math.max(...MASTER.sources.map(s=>s.scans));
  const rows=MASTER.sources.map(s=>{
    const tag=s.tag==="best"?`<span class="chip green">★ ${t("best")}</span>`:s.tag==="worst"?`<span class="chip coral">⚠ ${t("worst")}</span>`:"";
    return `<div class="card" style="margin-bottom:8px${s.tag==="worst"?";border-color:rgba(255,111,97,.4)":""}">
      <div class="rowline"><div class="grow"><h3 style="font-size:13.5px">${s.code}</h3><div class="tiny">${esc(s.where)}</div></div>${tag}</div>
      <div class="rowline" style="margin-top:9px;gap:12px">
        <span class="tiny">${t("stageScans")} <b class="num" style="color:var(--ink)">${s.scans}</b></span>
        <span class="tiny">conv <b class="num" style="color:var(--ink)">${s.conv}%</b></span>
        <span class="tiny">${t("tabs.bookings")} <b class="num" style="color:var(--ink)">${s.bookings}</b></span>
      </div>
      <div class="meter"><i style="width:${s.scans/maxS*100}%;background:${s.tag==="worst"?"var(--coral)":"var(--teal)"}"></i></div>
      ${s.tag==="worst"?`<div class="tiny" style="margin-top:7px;color:var(--coral)">${t("placement")}</div>`:""}
    </div>`;
  }).join("");
  return `${sec(t("chMix"),"")}<div class="card"><div class="donut-wrap">${svgDonut(donutParts,"214",t("stageScans"))}<div class="donut-legend">${legend}</div></div></div>
    ${sec(t("srcTitle"),"")}<div class="chart-note">${t("srcNote")}</div>${rows}`;
}
function scrMasterOps(){
  const sys=MASTER.sys.map(x=>`<div class="checkrow">${okDot(x.ok)}<div class="t"><b>${esc(x.k)}</b></div><span class="tiny">${esc(x.note)}</span></div>`).join("");
  const ch=MASTER.channels.map((c,i)=>`<div class="checkrow">${chBadge(c.code)}<div class="t"><b>${c.ch}</b></div>
      ${c.paused?`<span class="chip coral">${t("pausedChip")}</span>`:""}
      <button class="btn small ${c.paused?"primary":"ghost"}" onclick="chToggle(${i})">${c.paused?t("resume"):t("pause")}</button>
    </div>`).join("");
  const model=`<div class="card">
      ${kv(t("promptLive"),`<span class="chip teal">v1.4</span> <span class="chip green">NPS +3</span>`)}
      ${kv("Chat",`<span class="chip grey">claude-sonnet-4-6</span>`)}
      ${kv("Routing",`<span class="chip grey">claude-haiku-4-5</span>`)}
      ${kv(t("costToday"),`<span class="num">$18.40</span> / $30`)}
    </div><div class="meter" style="margin:-6px 2px 14px"><i style="width:61%;background:var(--teal)"></i></div>`;
  const qa=`<div class="btnrow" style="margin-top:4px"><button class="btn primary" onclick="toast(t('digestSent'))">${t("sendDigest")}</button></div>
    <div class="btnrow"><button class="btn ghost" onclick="toast(t('exported'))">${t("exportCsv")}</button>
    <button class="btn ghost" onclick="toast(t('pinged'))">${t("pingKeep")}</button></div>`;
  return `${sec(t("sysHealth"),"")}<div class="card">${sys}</div>
    ${sec(t("channelCtl"),"")}<div class="card">${ch}</div>
    ${sec(t("promptLive"),"")}${model}
    ${sec(t("quickActions"),"")}${qa}`;
}

/* ================= master actions ================= */
function assignLead(i){ const l=DATA.leads[i]; l.assigned = MASTER.assignees[l.vertical] || "Team"; toast(t("leadAssigned")); render(); }
function vendorAct(i,yes){
  MASTER.pending[i].state = yes?"approved":"rejected";
  if(yes) MASTER.supplyPulse.live++;
  MASTER.supplyPulse.pending=Math.max(0,MASTER.supplyPulse.pending-1);
  toast(yes?t("liveToAI"):t("rejectedT")); render();
}
function chToggle(i){ const c=MASTER.channels[i]; c.paused=!c.paused; toast(c.paused?t("chPaused"):t("chResumed")); render(); }

/* ================= detail sheets ================= */
function openConvo(i){
  const m=DATA.stream[i];
  const msgs=m.convo.map(x=> x.r==="tool" ? `<div class="toolcall">⚙ ${esc(x.t)}</div>`
    : `<div class="msg ${x.r==="user"?"user":"ai"}"><div class="who">${x.r==="user"?"USER":"NUM"}</div>${esc(x.t)}</div>`).join("");
  openSheet(`<h2>${m.h}</h2><div class="rowline" style="margin:4px 0 12px">${chBadge(m.ch)}${langBadge(m.lang)}${intentChip(m.intent)}</div>${msgs}`);
}
function openLead(i){
  const l=DATA.leads[i];
  const stages=["new","contacted","qualified","closing"];
  const bar=`<div class="stagebar">${stages.map((_,k)=>`<i class="${k<=l.status?"done":""}"></i>`).join("")}</div><div class="tiny" style="margin-top:5px">${t("statusPipe")}: ${stages[l.status]}</div>`;
  openSheet(`<h2>${l.icon} ${esc(l.label)}</h2>
    <div class="rowline" style="margin:4px 0 10px">${scoreChip(l.score)}${slaChip(l.sla)}${langBadge(l.lang)}<span class="chip grey">${l.handle}</span></div>
    ${kv(t("budget"),`<span class="num">${esc(l.budget)}</span>`)}
    ${kv(t("timeline"),esc(l.tl))}
    ${kv(t("partySize"),esc(l.party))}
    ${kv(t("langPref"),t("langNames."+l.lang))}
    ${bar}
    <div class="sec"><h2>${t("memory")}</h2></div>
    ${l.mem.map(m=>`<div class="checkrow"><span>🧠</span><div class="t sub">${esc(m)}</div></div>`).join("")}
    <div class="sec"><h2>${t("nextTouch")}</h2></div>
    <div class="card" style="border-color:rgba(47,212,194,.35)"><div class="sub">💡 ${esc(l.next)}</div></div>
    <div class="btnrow">
      <button class="btn ghost" onclick="closeSheet()">←</button>
      <button class="btn primary" onclick="leadContacted(${i})">${t("markContacted")}</button>
    </div>`);
}
function openRoleSheet(){
  const rows=Object.entries(ROLES).map(([id,r])=>`
    <div class="rolerow ${S.role===id?"on":""}" onclick="setRole('${id}')">
      <span class="ico">${r.ico}</span>
      <div><h3>${t("roles."+id)}</h3><div class="tiny">${t("roleSub."+id)}</div></div>
      <span class="chip ${r.app==="merchantApp"?"sand":r.app==="lumiApp"?"coral":"teal"} app">${t(r.app)}</span>
    </div>`).join("");
  openSheet(`<h2>${t("switchRole")}</h2><div style="margin-top:8px">${rows}</div>`);
}

/* ================= actions ================= */
function claimLead(i){ DATA.leads[i].claimed=true; toast(t("claimed")); render(); }
function leadContacted(i){ DATA.leads[i].status=Math.max(DATA.leads[i].status,1); closeSheet(); toast(t("handledOk")); render(); }
function bookAct(i,yes){ DATA.bookingQueue[i].state=yes?"confirmed":"declined"; toast(yes?t("accepted"):t("declined")); render(); }
function gradeSel(grp,val){ S.gradeSel[grp]=val; render(); }
function gradeNext(save){ if(save) toast(t("graded")); S.gradeIdx++; S.gradeSel={intent:null,quality:null}; render(); }
function flagAct(i,yes){ DATA.flags.splice(i,1); toast(yes?t("flagOk"):t("flagNo")); render(); }
function setRole(id){ S.role=id; S.tab=ROLES[id].tabs[0][0]; closeSheet(); render(); }
function setTab(id){ S.tab=id; render(); $("main").scrollTop=0; }
function toggleLang(){ S.lang = S.lang==="en" ? "th" : "en"; render(); }

/* ================= router + render ================= */
const SCREENS = {
  master:{flow:scrMasterFlow,whales:scrMasterWhales,supply:scrMasterSupply,traffic:scrMasterTraffic,ops:scrMasterOps},
  operator:{today:scrOperatorToday,leads:scrOperatorLeads,channels:scrOperatorChannels,merchants:scrOperatorMerchants,more:scrOperatorMore},
  executive:{scorecard:scrExecScorecard,revenue:scrExecRevenue,pipeline:scrExecPipeline,health:scrExecHealth,digest:scrExecDigest},
  specialist:{hot:scrSpecHot,queue:scrSpecQueue,waiting:scrSpecWaiting,closed:scrSpecClosed},
  merchant:{week:scrMercWeek,bookings:scrMercBookings,listing:scrMercListing,reviews:scrMercReviews,asks:scrMercAsks},
  quality:{grade:scrQualGrade,flags:scrQualFlags,accuracy:scrQualAccuracy,prompts:scrQualPrompts},
  admin:{tenants:scrAdmTenants,platform:scrAdmPlatform,costs:scrAdmCosts,pipe:scrAdmPipe,contracts:scrAdmContracts},
};
function render(){
  $("roleName").textContent = t("roles."+S.role);
  $("langNow").textContent = S.lang.toUpperCase();
  $("langAlt").textContent = S.lang==="en" ? "TH" : "EN";
  $("tabbar").innerHTML = ROLES[S.role].tabs.map(([id,ico])=>
    `<button class="${S.tab===id?"on":""}" onclick="setTab('${id}')"><span class="ico">${ico}</span>${t("tabs."+id)}</button>`).join("");
  const fn = SCREENS[S.role][S.tab] || (()=> "");
  $("main").innerHTML = `<div class="fade-enter">${fn()}</div>`;
}
render();
</script>
</body>
</html>
